title: Oxide Stage 1 Decoy Common-Utility IAT Shape
id: 7c3e1d9a-2b5f-4c8e-9a6d-3f4b5c6d7e8a
status: experimental
description: |
  Detects the S39 IAT-cosmetic refactor of Oxide Stage 1: a small PE
  that imports only kernel32 with a common-utility decoy set
  (GetCommandLineA, HeapAlloc/Free, WideCharToMultiByte,
  SetUnhandledExceptionFilter, GetTickCount, etc.) while resolving the
  real offensive APIs (VirtualAlloc, WinInet, Nt*) at runtime via PEB
  walk + djb2 hashing.

  Supersedes the prior S33 minimal-IAT rule, which expected a 0/1
  import IAT. The S39 build deliberately moved into the 12-15 entry
  range to escape that outlier signature; this rule re-targets the
  refactor by combining import-name shape with size + DLL-set
  constraints.
references:
  - https://github.com/diemoeve/oxide-loader
  - https://attack.mitre.org/techniques/T1027/007/
  - https://attack.mitre.org/techniques/T1480/
  - detection/yara/stage1_decoy_iat_shape.yar
author: diemoeve
date: 2026/05/07
modified: 2026/05/07
tags:
  - attack.defense_evasion
  - attack.t1027.007  # Dynamic API Resolution
  - attack.t1480      # Execution Guardrails
  - attack.t1106      # Native API
logsource:
  category: image_load
  product: windows
  definition: |
    Requires Sysmon ImageLoad (Event ID 7) enriched with a sidecar PE
    parser that publishes ImportedDllCount, ImportedFunctionCount, and
    ImportedDllNames / ImportedFunctionNames as searchable fields.
    Sysmon does not natively emit these — the rule is a hunt template
    for SIEMs that ingest a separate PE-static enrichment feed (yara-
    forge, capa-rules sidecar, or a custom scanner on
    file_create / image_load).
detection:
  selection:
    EventID: 7
    Image|endswith: '.exe'
  filter_size:
    # Small PE — the loader builds well under 16KB. Tighter than the
    # legacy 32KB threshold to suppress the generic-installer band.
    ImageSize|lte: 16384
  filter_iat_shape:
    # Single imported DLL, kernel32 only. Wininet / ws2_32 / winhttp /
    # urlmon / ntdll absence is part of the signal — a real network-
    # capable utility this small almost always pulls one of those in.
    ImportedDllCount: 1
    ImportedDllNames|contains|all:
      - 'KERNEL32.dll'
  filter_function_count:
    # The decoy set sits in the 12-15 range (12 in the canonical
    # build). Lower bound suppresses the legacy 0/1-import outliers
    # that the old rule caught; upper bound suppresses bigger CRT-
    # linked utilities.
    ImportedFunctionCount|gte: 10
    ImportedFunctionCount|lte: 18
  filter_decoy_names:
    # At least three of the common-utility decoy names must be
    # present. Matches the YARA rule's `3 of` selector.
    ImportedFunctionNames|contains|any:
      - 'GetCommandLineA'
      - 'GetUserDefaultLocaleName'
      - 'GetSystemTimeAsFileTime'
      - 'GetTickCount'
      - 'GetCurrentProcessId'
      - 'HeapAlloc'
      - 'WideCharToMultiByte'
      - 'SetUnhandledExceptionFilter'
  filter_no_network_dlls:
    # If any of these are present, the binary is not the IAT-shape
    # outlier S39 produces — it imports network calls openly.
    ImportedDllNames|contains|any:
      - 'WININET.dll'
      - 'WINHTTP.dll'
      - 'WS2_32.dll'
      - 'URLMON.dll'
      - 'ntdll.dll'
  condition: selection and filter_size and filter_iat_shape and filter_function_count and filter_decoy_names and not filter_no_network_dlls
fields:
  - Image
  - ImageSize
  - ImportedDllCount
  - ImportedDllNames
  - ImportedFunctionCount
  - ImportedFunctionNames
  - Hashes
  - User
  - ProcessGuid
falsepositives:
  - Tiny non-network OEM utilities (RtkAud helpers, sysinternals
    micro-tools) that share the common-utility kernel32 set. Chain
    with the YARA peb-walk + djb2 prologue rule for code-pattern
    confirmation, or allowlist by signer.
  - Packed / VMProtect / Themida benigns whose unpacked stub happens
    to land in the same import range. Most packers retain a non-
    decoy set (e.g. LoadLibraryA / GetProcAddress / VirtualAlloc).
  - Custom-stub Rust / Go release PEs with a hand-rolled CRT and a
    small kernel32 import set. Allowlist by SHA-256 or signer.
level: medium
