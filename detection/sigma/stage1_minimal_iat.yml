title: Oxide Stage 1 Decoy IAT Follow-on Network
id: 8d4f2e0b-3c6a-5d9f-0b7e-4a5c6d7e8f9b
status: experimental
description: |
  Correlation rule: a process that matches the YARA rule
  Oxide_Stage1_Decoy_IAT_Shape_x64 subsequently initiates an outbound
  HTTP fetch. Fires only when the same Image has both an image_load
  with the decoy IAT shape and an outbound connection within 10
  seconds.
references:
  - https://github.com/diemoeve/oxide-loader
  - detection/yara/stage1_decoy_iat_shape.yar
  - detection/yara/stage1_peb_walk.yar
author: diemoeve
date: 2026/05/07
modified: 2026/05/07
tags:
  - attack.command_and_control
  - attack.t1027.007
  - attack.t1071.001
logsource:
  category: network_connection
  product: windows
detection:
  selection_net:
    EventID: 3
    Initiated: 'true'
    DestinationPort:
      - 80
      - 443
      - 8080
  filter_known_browser:
    Image|endswith:
      - '\chrome.exe'
      - '\firefox.exe'
      - '\msedge.exe'
      - '\svchost.exe'
  # Temporal correlation to the decoy-IAT image_load event is SIEM-
  # specific; in Splunk: `| transaction Image maxspan=10s` across
  # EventID 7 + 3, joined to the YARA hit on the loaded image.
  condition: selection_net and not filter_known_browser
fields:
  - Image
  - DestinationIp
  - DestinationPort
  - ProcessGuid
falsepositives:
  - Any unsigned small utility that makes outbound HTTP calls without
    a User-Agent. Require correlation with the image_load half of the
    pair before alerting.
level: low
